<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftNotes Viewer</title>
    <style>
        body { font-family: system-ui; background: linear-gradient(135deg, #1e1e2f, #2a2a4a); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-left: 10px; }
        button:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-stop { background: rgba(253, 107, 138, 0.2); border-color: rgba(253, 107, 138, 0.5); }
        .btn-stop:hover { background: rgba(253, 107, 138, 0.4); }
        
        .workspace { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        .col { flex: 1; display: flex; flex-direction: column; overflow-y: auto; gap: 10px; padding-right: 5px; }
        .note-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 3px solid #6b8afd; line-height: 1.5; }
        
        #search-panel { flex: 0.8; display: none; flex-direction: column; border-left: 3px solid #fd6b8a; }
        iframe { flex: 1; width: 100%; border: none; border-radius: 8px; background: white; }
        
        /* Viewer UI */
        #viewer-modal { display: none; position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%; z-index: 100; flex-direction: row; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #file-list { flex: 0.3; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; padding-right: 10px; }
        #file-content { flex: 0.7; padding-left: 20px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
        .file-item { padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .file-item:hover { background: rgba(255,255,255,0.1); }
        
        /* Editable Title Input */
        #class-name-input { font-size: 1.5em; font-weight: bold; font-family: inherit; background: rgba(0,0,0,0.3); color: white; border: 1px solid #6b8afd; border-radius: 5px; padding: 5px; outline: none; }
    </style>
</head>
<body>

    <nav class="glass">
        <div>
            <div id="title-container" onclick="editTitle()">
                <h2 id="class-name" style="margin: 0; cursor: pointer;" title="Click to rename subject">Detecting Class...</h2>
            </div>
            <small id="status">Status: Idle</small>
        </div>
        <div>
            <button onclick="togglePause()">Play / Pause</button>
            <button class="btn-stop" onclick="endLecture()">End Lecture</button>
            <button onclick="toggleViewer()">Viewer Mode</button>
        </div>
    </nav>

    <div class="workspace">
        <div class="col glass">
            <h3 style="margin-top:0;">Transcribed Notes</h3>
            <div id="notes-container" class="col"></div>
        </div>
        
        <div class="col glass">
            <h3 style="margin-top:0;">Lecture Summary</h3>
            <div id="summaries-container" class="col">
                <em style="color: #aaa;">Summary will be generated when lecture ends...</em>
            </div>
        </div>

        <div id="search-panel" class="glass">
            <h3 style="margin-top:0; color: #fd6b8a;">AI Reference</h3>
            <iframe id="search-frame" src=""></iframe>
        </div>
    </div>

    <!-- Viewer Mode Overlay -->
    <div id="viewer-modal" class="glass">
        <div id="file-list"></div>
        <div id="file-content">Select a subject to view its dates...</div>
        <button onclick="toggleViewer()" style="position:absolute; top:15px; right:15px; background: red; color: white;">Close</button>
    </div>

    <script>
        let searchTimeout;
        let knownNotesCount = 0;
        let summaryDisplayed = false;
        let isEditingTitle = false;
        let lastKnownClasses = [];
        let allFiles = []; // For Viewer Mode caching

        async function fetchState() {
            const res = await fetch('/api/state');
            const state = await res.json();
            
            // Protect the title from being overwritten by the API loop while you are typing
            if (!isEditingTitle) {
                document.getElementById('class-name').innerText = state.class_name;
            }
            
            lastKnownClasses = state.existing_classes;
            document.getElementById('status').innerText = `Status: ${state.activity} | Recording: ${state.is_recording}`;

            // Append new notes
            if (state.notes.length > knownNotesCount) {
                const newNotes = state.notes.slice(knownNotesCount);
                newNotes.forEach(note => {
                    document.getElementById('notes-container').innerHTML += `<div class="note-card">${note.paragraph}</div>`;
                });
                knownNotesCount = state.notes.length;
            }

            // Display master summary
            if (state.lecture_summary && !summaryDisplayed) {
                const mdFormat = state.lecture_summary.replace(/\n/g, '<br>');
                document.getElementById('summaries-container').innerHTML = `<div class="note-card" style="border-left-color:#fd6b8a">${mdFormat}</div>`;
                summaryDisplayed = true;
            }

            // Handle Search Panel
            if (state.search_query) {
                triggerInteractiveSearch(state.search_query);
                fetch('/api/clear_search', { method: 'POST' }); 
            }
        }

        // --- Title Editing Logic ---
        function editTitle() {
            if (isEditingTitle) return;
            isEditingTitle = true;
            
            const currentName = document.getElementById('class-name').innerText;
            const container = document.getElementById('title-container');
            
            // Build the dropdown options dynamically from previous classes
            let datalistOptions = lastKnownClasses.map(c => `<option value="${c}">`).join('');
            
            container.innerHTML = `
                <input type="text" id="class-name-input" list="class-list" value="${currentName === 'Detecting...' ? '' : currentName}">
                <datalist id="class-list">
                    ${datalistOptions}
                </datalist>
            `;
            
            const input = document.getElementById('class-name-input');
            input.focus();
            
            // Save when clicking away or hitting Enter
            input.addEventListener('blur', saveTitle);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveTitle();
            });
        }

        async function saveTitle() {
            const input = document.getElementById('class-name-input');
            if (!input) return; // Prevent double-firing
            
            const newName = input.value.trim() || "Unknown Class";
            isEditingTitle = false;
            
            document.getElementById('title-container').innerHTML = `<h2 id="class-name" style="margin: 0; cursor: pointer;" title="Click to rename subject">${newName}</h2>`;
            
            await fetch('/api/rename_class', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ class_name: newName })
            });
        }

        // --- Viewer Logic ---
        async function toggleViewer() {
            const modal = document.getElementById('viewer-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                const res = await fetch('/api/files');
                allFiles = await res.json();
                renderViewerSubjects();
            }
        }

        function renderViewerSubjects() {
            // Filter down to a unique list of class names
            const subjects = [...new Set(allFiles.map(f => f.class))];
            
            let listHtml = '<h3 style="margin-top:0; color: #fd6b8a;">Subjects</h3>';
            subjects.forEach(sub => {
                listHtml += `<div class="file-item" onclick="renderViewerDates('${sub}')">
                    <strong>📁 ${sub}</strong>
                </div>`;
            });
            document.getElementById('file-list').innerHTML = listHtml;
            document.getElementById('file-content').innerText = "Select a subject to view its dates...";
        }

        function renderViewerDates(subject) {
            // Find all files belonging to the clicked subject
            const dates = allFiles.filter(f => f.class === subject);
            
            let listHtml = `<h3 style="margin-top:0; color: #fd6b8a; cursor: pointer;" onclick="renderViewerSubjects()">⬅️ Back to Subjects</h3>`;
            listHtml += `<h4 style="margin: 0 0 10px 0;">${subject}</h4>`;
            
            dates.forEach(f => {
                listHtml += `<div class="file-item" onclick="viewFile('${f.path.replace(/\\/g, '\\\\')}')">
                    <strong>📄 ${f.date}</strong>
                </div>`;
            });
            document.getElementById('file-list').innerHTML = listHtml;
        }

        async function viewFile(path) {
            const res = await fetch('/api/file_content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: path })
            });
            const data = await res.json();
            document.getElementById('file-content').innerText = data.content;
        }

        // --- Standard Controls ---
        function triggerInteractiveSearch(term) {
            const panel = document.getElementById('search-panel');
            const iframe = document.getElementById('search-frame');
            iframe.src = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(term)}`;
            panel.style.display = 'flex';
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                panel.style.display = 'none';
                iframe.src = "";
            }, 120000);
        }

        async function togglePause() {
            await fetch('/api/toggle_pause', { method: 'POST' });
        }

        async function endLecture() {
            if(confirm("End the lecture and generate the final summary?")) {
                document.getElementById('summaries-container').innerHTML = `<em style="color: #fd6b8a;">Generating master summary...</em>`;
                await fetch('/api/end_lecture', { method: 'POST' });
            }
        }

        setInterval(fetchState, 2000);
    </script>
</body>
</html>
