<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftNotes Pro</title>
    <style>
        /* Base styling and Glassmorphism */
        body { font-family: system-ui; background: linear-gradient(135deg, #1e1e2f, #2a2a4a); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; }
        
        /* Layout */
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-container { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        .column { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Search Panel */
        #search-panel { flex: 0.8; display: none; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="glass">
        <h2 id="current-class">Detecting Class...</h2>
        <button id="viewer-mode">Viewer Mode (Past Notes)</button>
    </nav>

    <div class="main-container">
        <!-- Vertical list for Note Paragraphs -->
        <div class="column glass" id="notes-col">
            <h3>Transcribed Notes</h3>
        </div>

        <!-- Vertical list for Summaries -->
        <div class="column glass" id="summaries-col">
            <h3>Summaries</h3>
        </div>

        <!-- Dynamic Search Panel -->
        <div class="column glass" id="search-panel">
            <h3>Related Search</h3>
            <iframe id="search-frame" src=""></iframe>
        </div>
    </div>

    <script>
        const notesCol = document.getElementById('notes-col');
        const summariesCol = document.getElementById('summaries-col');
        const searchPanel = document.getElementById('search-panel');
        const searchFrame = document.getElementById('search-frame');
        const classHeader = document.getElementById('current-class');
        
        let searchTimeout;

        // 1. Continuous Listening Setup
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            processTranscript(transcript); // Send to AI without stopping recognition
        };

        // Auto-restart if it drops out
        recognition.onend = () => recognition.start();
        recognition.start();

        // 2. Async Processing
        async function processTranscript(text) {
            try {
                const response = await fetch('/process_note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json(); // AI always responds as JSON
                updateUI(data);
            } catch (err) {
                console.error("Error processing note:", err);
            }
        }

        // 3. Robust UI Updating & Search Timer Logic
        function updateUI(data) {
            classHeader.innerText = data.class_name;

            const noteDiv = document.createElement('div');
            noteDiv.innerText = data.paragraph;
            notesCol.appendChild(noteDiv);

            const summaryDiv = document.createElement('div');
            summaryDiv.innerText = data.summary;
            summariesCol.appendChild(summaryDiv);

            if (data.search_term) {
                triggerSearchPanel(data.search_term);
            }
        }

        function triggerSearchPanel(term) {
            searchPanel.style.display = 'flex';
            // Using Wikipedia or DuckDuckGo as many sites (like Google) block iframe embedding
            searchFrame.src = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(term)}`;
            
            clearTimeout(searchTimeout); // Reset timer if a new term comes in
            searchTimeout = setTimeout(() => {
                searchPanel.style.display = 'none';
                searchFrame.src = "";
            }, 120000); // Closes after 2 minutes
        }
    </script>
</body>
</html>
